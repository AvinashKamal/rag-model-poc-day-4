[project]
name = "orchestrator-mcp"
version = "0.1.0"
description = "Custom MCP server for orchestrated development of the scientific-literature RAG POC: corpus fetch, domain tagging, pipeline orchestration, k6 trigger/results."
requires-python = ">=3.11"
dependencies = [
    "mcp>=1.2.0",
    "httpx>=0.27",
    "domain-lib",
]

[project.scripts]
orchestrator-mcp = "orchestrator_mcp.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/orchestrator_mcp"]

[tool.uv.sources]
domain-lib = { path = "../shared/domain_lib", editable = true }
