[project]
name = "eval"
version = "0.1.0"
description = "Retrieval-quality eval harness for the scientific-literature RAG POC — calls the real backend /query endpoint against hand-curated gold question sets and pushes aggregate metrics over OTLP."
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.28.1",
    "openai>=3.16.2",
    "opentelemetry-api>=1.44.0",
    "opentelemetry-sdk>=1.44.0",
    "opentelemetry-exporter-otlp>=1.44.0",
]

[dependency-groups]
dev = ["pytest>=8.0.0"]

[tool.uv]
# eval/run_eval.py is a standalone script (invoked as `python run_eval.py`,
# see its `if __name__ == "__main__"` block), not an importable package —
# this pyproject.toml exists to declare/pin its actual dependencies for
# `uv sync`/`pip install`, not to build a distributable wheel.
package = false
