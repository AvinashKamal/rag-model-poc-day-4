[project]
name = "domain-lib"
version = "0.1.0"
description = "Shared domain registry, corpus fetchers, and domain-tagging logic for the scientific-literature RAG POC."
requires-python = ">=3.11"
dependencies = [
    "pyyaml>=6.0",
    "pydantic>=2.0",
    "httpx>=0.27",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/domain_lib"]
